name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_gcServer: '0'
      DOTNET_GCHeapCount: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Restore and audit
        run: dotnet restore tests/AssignmentChecks/AssignmentChecks.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true
      - name: Build
        run: dotnet build tests/AssignmentChecks/AssignmentChecks.csproj -c AssignmentChecks --no-restore -m:1 -p:UseSharedCompilation=false -p:UseAppHost=false
      - name: Verify LocalDB is available
        run: sqllocaldb info
      - name: Run isolated integration checks
        run: dotnet tests/AssignmentChecks/bin/AssignmentChecks/net10.0/AssignmentChecks.dll
      - name: Verify SaaS subscription lifecycle and isolation
        run: dotnet tests/AssignmentChecks/bin/AssignmentChecks/net10.0/AssignmentChecks.dll --subscription-only
      - name: Verify payment provider responses and signatures
        run: dotnet tests/AssignmentChecks/bin/AssignmentChecks/net10.0/AssignmentChecks.dll --payment-provider-only
      - name: Publish deployable artifacts
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: web-and-api
          path: artifacts/publish
          retention-days: 7
